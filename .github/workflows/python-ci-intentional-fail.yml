name: Python CI (Intentional Fail)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run pytest (intentional fail)
        run: |
          pytest | tee pytest-output.txt
        continue-on-error: true

      - name: Create failure_context.json
        if: always()
        run: |
          python scripts/analyze_failure.py pytest-output.txt failure_context.json

      - name: Configure AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-bedrock-role
          aws-region: us-east-1

      - name: AI Analysis (Bedrock Claude)
        if: always()
        run: |
          python scripts/analyze_failure.py failure_context.json analysis-output.json
          cat analysis-output.json
          python scripts/print_bedrock_markdown_summary.py analysis-output.json
